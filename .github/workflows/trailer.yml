name: Capture trailer footage
on: workflow_dispatch
permissions:
  contents: write
jobs:
  cap:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: |
          curl -fL --retry 3 https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js -o three.min.js
          npm init -y >/dev/null && npm i playwright >/dev/null && npx playwright install --with-deps chromium >/dev/null
      - run: node trailer/capture.js
      - name: Encode
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get install -y -qq ffmpeg >/dev/null
          mkdir -p out
          cp frames_check.jpg out/check.jpg; cp frames/f00000.jpg out/sample0.jpg; cp frames/f00100.jpg out/sample1.jpg; cp frames/f00250.jpg out/sample2.jpg
          ffmpeg -y -framerate 24 -i frames/f%05d.jpg -c:v libx264 -crf 20 -preset veryfast -pix_fmt yuv420p out/footage.mp4
      - name: Push footage branch
        run: |
          cd out && git init -q && git checkout -q -b footage && git add -A
          git -c user.name=ci -c user.email=ci@x commit -qm footage
          git push -f https://x-access-token:${{ github.token }}@github.com/${{ github.repository }} footage
