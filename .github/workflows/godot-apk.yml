name: Build APK (Godot - fatia de teste)
on:
  push:
    paths: ['godot/**', '.github/workflows/godot-apk.yml']
  workflow_dispatch:
concurrency:
  group: godot-slice-release
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Baixar Godot 4.3 e os modelos de exportação Android
        run: |
          curl -fsSL --retry 3 -o g.zip https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q g.zip && mv Godot_v4.3-stable_linux.x86_64 godot-bin && chmod +x godot-bin
          curl -fsSL --retry 3 -o t.tpz https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/4.3.stable
          unzip -q -j t.tpz 'templates/android_debug.apk' 'templates/android_release.apk' 'templates/version.txt' -d ~/.local/share/godot/export_templates/4.3.stable
          rm t.tpz g.zip
      - name: Chave de depuração e configurações do editor
        run: |
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore "$PWD/debug.keystore" -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.3.tres <<EOT
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_SDK_ROOT"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$PWD/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOT
          sed -i 's/^ *//' ~/.config/godot/editor_settings-4.3.tres
          cat ~/.config/godot/editor_settings-4.3.tres
      - name: Importar e exportar o APK
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ github.workspace }}/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          cd godot
          echo "${GITHUB_SHA::7}" > build.txt
          ../godot-bin --headless --editor --quit --path . || true
          mkdir -p build
          ../godot-bin --headless --path . --export-debug "Android" build/CrazyThiefDudeNext.apk
          ls -la build
          test -s build/CrazyThiefDudeNext.apk
      - uses: actions/upload-artifact@v4
        with: { name: CrazyThiefDudeNext-apk, path: godot/build/CrazyThiefDudeNext.apk }
      - name: Publicar APK na aba Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp godot/build/CrazyThiefDudeNext.apk CrazyThiefDudeNext.apk
          NOTES="Build ${GITHUB_RUN_NUMBER} (${GITHUB_SHA::7}). Protótipo em Godot 4.3. Instala ao lado dos outros APKs. O contador do jogo mostra b${GITHUB_SHA::7}."
          # atualiza a release existente (apagar e recriar passou a dar HTTP 500 no GitHub)
          if gh release view godot-slice >/dev/null 2>&1; then
            # o GitHub às vezes responde 500 mesmo concluindo o envio: tenta de novo e confere pelo tamanho
            SIZE=$(stat -c %s CrazyThiefDudeNext.apk)
            for i in 1 2 3 4; do
              gh release upload godot-slice CrazyThiefDudeNext.apk --clobber && break
              sleep 25
              if gh release view godot-slice --json assets --jq ".assets[] | select(.name==\"CrazyThiefDudeNext.apk\") | .size" | grep -qx "$SIZE"; then break; fi
            done
            gh release edit godot-slice --title "Crazy Thief Dude Next (fatia de teste Godot)" --notes "$NOTES" || true
          else
            gh release create godot-slice CrazyThiefDudeNext.apk --target "$GITHUB_SHA" --title "Crazy Thief Dude Next (fatia de teste Godot)" --notes "$NOTES"
          fi
